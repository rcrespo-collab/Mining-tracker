<title>Angola Critical-Minerals Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: survey-sheet workbench – map sheet on the left with a legend rail, evidence card on the right; registers as further sheets. */
:root{
  --paper:#eef1ee; --sheet:#f8faf8; --ink:#17262b; --ink-2:#44555b; --rule:#c9d2cf; --water:#d8e6ec;
  --land:#f3f2ea; --land-2:#e4e6dc; --accent:#0f6b72; --accent-ink:#ffffff; --copper:#b4532a;
  --ev-measured:#1f4fa3; --ev-occurrence:#b7791f; --ev-operator:#9b3c86; --ev-interpretation:#5f6b70; --ev-coverage:#2f7d4f;
  --ok:#2f7d4f; --warn:#b7791f; --bad:#b23a3a; --shadow:0 6px 24px rgba(15,40,45,.16);
  --f-display:"Archivo Narrow","Arial Narrow",Arial,sans-serif; --f-body:"Source Serif 4",Georgia,serif; --f-data:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1719; --sheet:#152024; --ink:#e3ebe8; --ink-2:#a5b4b3; --rule:#2c3b3f; --water:#142a33;
  --land:#1d2a2c; --land-2:#253538; --accent:#4fb3b8; --accent-ink:#06191b; --copper:#e08b5e;
  --ev-measured:#7aa5f0; --ev-occurrence:#e3b04d; --ev-operator:#d68ac4; --ev-interpretation:#a3b0b4; --ev-coverage:#6cc28f;
  --ok:#6cc28f; --warn:#e3b04d; --bad:#ef7d7d; --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1719; --sheet:#152024; --ink:#e3ebe8; --ink-2:#a5b4b3; --rule:#2c3b3f; --water:#142a33;
  --land:#1d2a2c; --land-2:#253538; --accent:#4fb3b8; --accent-ink:#06191b; --copper:#e08b5e;
  --ev-measured:#7aa5f0; --ev-occurrence:#e3b04d; --ev-operator:#d68ac4; --ev-interpretation:#a3b0b4; --ev-coverage:#6cc28f;
  --ok:#6cc28f; --warn:#e3b04d; --bad:#ef7d7d; --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:.01em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.lbl{font-family:var(--f-display);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2)}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--sheet);border-bottom:1px solid var(--rule)}
.hbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand h1{font-size:21px;line-height:1.1}
.brand .sub{font:12px var(--f-data);color:var(--ink-2)}
nav.views{display:flex;flex-wrap:wrap;gap:4px}
nav.views button{border:1px solid var(--rule);background:transparent;border-radius:3px;padding:5px 10px;font-family:var(--f-display);font-weight:600;font-size:14px}
nav.views button[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.search{position:relative;flex:1 1 240px;max-width:420px;min-width:0}
.search input{width:100%;border:1px solid var(--rule);background:var(--paper);border-radius:3px;padding:7px 10px}
.results{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--sheet);border:1px solid var(--rule);box-shadow:var(--shadow);max-height:360px;overflow:auto;z-index:20;border-radius:3px}
.results button{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;border:0;background:transparent;padding:7px 10px;border-bottom:1px solid var(--rule)}
.results button:hover,.results button:focus-visible{background:var(--land-2)}
.results small{color:var(--ink-2);font-family:var(--f-data);font-size:11px}

/* atlas view */
main{padding-block:14px 40px}
.atlas{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,1fr);gap:14px;align-items:start}
@media (max-width:980px){.atlas{grid-template-columns:minmax(0,1fr)}}
.paths{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.paths button{flex:1 1 200px;text-align:left;border:1px solid var(--rule);background:var(--sheet);border-radius:3px;padding:8px 12px}
.paths button b{display:block;font-family:var(--f-display);font-size:16px}
.paths button span{font-size:13px;color:var(--ink-2)}
.paths button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.mapsheet{position:relative;background:var(--sheet);border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.mapsheet svg{display:block;width:100%;height:auto;aspect-ratio:1/1.02;touch-action:none;background:var(--water);cursor:grab}
.mapsheet svg.drag{cursor:grabbing}
.maptools{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:4px;z-index:3}
.maptools button{width:32px;height:32px;border:1px solid var(--rule);background:var(--sheet);border-radius:3px;font-weight:700}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px 14px;padding:10px 12px;border-top:1px solid var(--rule);font-size:13px}
.legend label{display:flex;gap:6px;align-items:center}
.legend .sw{width:14px;height:10px;border:1px solid var(--ink-2);flex:none}
.opac{display:flex;gap:8px;align-items:center;padding:0 12px 10px;font-size:13px;flex-wrap:wrap}
.opac select{max-width:100%;border:1px solid var(--rule);background:var(--paper);border-radius:3px;padding:3px 6px}
.scalebar text,.mapsvg text{font-family:var(--f-data)}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:12px}
.board .col{background:var(--sheet);border:1px solid var(--rule);border-radius:3px;padding:8px 10px;min-width:0}
.board .col h4{font-size:14px;display:flex;justify-content:space-between;gap:6px}
.board .col ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:3px}
.board .col li button{border:0;background:none;padding:0;text-align:left;color:var(--accent);font-size:13px;text-decoration:underline;text-underline-offset:2px}
.board .empty{font-size:12.5px;color:var(--ink-2)}

/* floating illustrations */
.floaters{position:absolute;inset:0;pointer-events:none;z-index:2}
.floater{position:absolute;pointer-events:auto;transform:translate(-50%,-50%);background:color-mix(in srgb,var(--sheet) 92%,transparent);border:1px solid var(--rule);border-radius:4px;box-shadow:var(--shadow);padding:3px 7px 3px 4px;display:flex;gap:5px;align-items:center;font-size:11px;line-height:1.15;white-space:nowrap;animation:bob 5s ease-in-out infinite}
.floater svg{width:24px;height:24px;flex:none;aspect-ratio:auto;background:none;cursor:default}
.floater b{font-family:var(--f-display);font-size:12.5px;display:block}
.floater i{font-style:normal;font-family:var(--f-data);font-size:10px;color:var(--ink-2)}
.floater .ev{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:3px;vertical-align:middle}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -4px}}
@media (prefers-reduced-motion:reduce){.floater{animation:none}}
.floaters.row{display:flex;flex-wrap:wrap;align-content:flex-start;gap:4px;padding:48px 46px 0 6px;pointer-events:none}
.floaters.row .floater{position:static;transform:none;animation:none}
.floatnote{position:absolute;left:8px;bottom:8px;z-index:3;font:11px var(--f-data);background:var(--sheet);border:1px solid var(--rule);padding:3px 6px;border-radius:3px;max-width:calc(100% - 16px)}

/* card */
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:3px;padding:14px 16px;min-width:0}
.card h2{font-size:22px;line-height:1.15}
.card .meta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--rule);border-radius:999px;padding:1px 8px;font:12px var(--f-display);letter-spacing:.02em;background:var(--paper)}
.chip.dec{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.chip .dot{width:8px;height:8px;border-radius:50%}
.axes{display:grid;grid-template-columns:1fr;gap:6px;margin:6px 0 12px}
.axis{display:grid;grid-template-columns:150px minmax(0,1fr) 34px;gap:8px;align-items:center;font-size:13px}
.axis .bar{height:10px;background:var(--land-2);border-radius:2px;position:relative;overflow:hidden}
.axis .bar span{position:absolute;inset:0 auto 0 0;border-radius:2px}
.card section{border-top:1px solid var(--rule);padding-top:8px;margin-top:10px}
.card section h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);margin-bottom:3px}
.card p{margin:0 0 4px}
.gate{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;font-size:14px}
.gate b{font-family:var(--f-display)}
.gate .adv{color:var(--ok)} .gate .def{color:var(--warn)} .gate .stop{color:var(--bad)}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:2px 10px;font-size:13.5px}
.kv dt{color:var(--ink-2);font-family:var(--f-display)}
.kv dd{margin:0}
.claims{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.claims li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px}
.evb{font:10.5px var(--f-data);text-transform:uppercase;letter-spacing:.04em;padding:1px 5px;border-radius:2px;color:#fff;white-space:nowrap;height:fit-content}
.ev-measured{background:var(--ev-measured)} .ev-occurrence{background:var(--ev-occurrence)} .ev-operator{background:var(--ev-operator)} .ev-interpretation{background:var(--ev-interpretation)} .ev-coverage{background:var(--ev-coverage)}
:root[data-theme="dark"] .evb{color:#06191b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .evb{color:#06191b}}
.claims small{display:block;color:var(--ink-2);font-family:var(--f-data);font-size:11px}
.flag{color:var(--bad)}
.thumbs{display:flex;flex-wrap:wrap;gap:6px}
.thumbs button{border:1px solid var(--rule);padding:0;background:var(--paper);width:92px;height:70px;overflow:hidden;border-radius:2px}
.thumbs img{width:100%;height:100%;object-fit:cover}
.pm{border-collapse:collapse;font-size:12px;width:100%}
.pm td,.pm th{border:1px solid var(--rule);padding:2px 4px;text-align:center}
.pm th{font-family:var(--f-display);font-weight:600;text-align:left}
.pm .D{background:var(--ev-measured);color:var(--sheet)} .pm .H{background:var(--copper);color:var(--sheet)} .pm .M{background:color-mix(in srgb,var(--copper) 45%,var(--sheet))} .pm .L{background:color-mix(in srgb,var(--copper) 15%,var(--sheet))}

/* compare */
.compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:760px){.compare{grid-template-columns:minmax(0,1fr)}}
.cmpwarn{margin:10px 0;padding:8px 12px;border:1px solid var(--warn);border-left-width:4px;background:var(--sheet);font-size:14px}
.cmpwarn.okk{border-color:var(--ok)}

/* registers */
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:3px;padding:14px 16px;margin-bottom:14px;min-width:0}
.sheet h2{font-size:20px;margin-bottom:6px}
.sheet > p{max-width:75ch;margin:0 0 10px}
.tbl{overflow-x:auto}
table.reg{border-collapse:collapse;width:100%;font-size:13px;min-width:720px}
table.reg th{font-family:var(--f-display);text-align:left;background:var(--land-2);position:sticky;top:0}
table.reg td,table.reg th{border-bottom:1px solid var(--rule);padding:5px 7px;vertical-align:top}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.filters button{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:2px 10px;font-size:13px}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.st-completed{color:var(--ok);font-weight:600} .st-required{color:var(--warn);font-weight:600}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.gallery figure{margin:0;background:var(--sheet);border:1px solid var(--rule);border-radius:3px;overflow:hidden;display:flex;flex-direction:column}
.gallery button{border:0;padding:0;background:var(--paper);height:170px}
.gallery img{width:100%;height:100%;object-fit:contain}
.gallery figcaption{padding:7px 9px;font-size:13px;display:flex;flex-direction:column;gap:4px}
dialog{border:1px solid var(--rule);background:var(--sheet);color:var(--ink);max-width:min(1100px,94vw);padding:10px;border-radius:4px}
dialog img{max-height:78vh;display:block;margin:auto}
dialog::backdrop{background:rgba(5,15,18,.6)}
.foot{font-size:12.5px;color:var(--ink-2);margin-top:18px;max-width:90ch}
</style>

<header class="wrap">
  <div class="hbar">
    <div class="brand"><h1>Angola Critical-Minerals Atlas</h1><span class="sub" id="asof"></span></div>
    <nav class="views" aria-label="Views">
      <button data-view="atlas" aria-pressed="true">Atlas</button>
      <button data-view="compare">Side-by-side</button>
      <button data-view="sources">Source register</button>
      <button data-view="requests">Data requests</button>
      <button data-view="verify">Verification</button>
      <button data-view="figures">Figures</button>
    </nav>
    <div class="search">
      <label class="lbl" for="q" hidden>Search</label>
      <input id="q" type="search" placeholder="Search a commodity, element, mineral or province…" autocomplete="off">
      <div class="results" id="results" hidden></div>
    </div>
  </div>
</header>

<main class="wrap">
  <!-- ATLAS -->
  <section id="v-atlas">
    <div class="paths" role="group" aria-label="Investment path">
      <button id="p-project" aria-pressed="true"><b>Evaluate existing projects</b><span>Titles and operators with reported work – test what is claimed</span></button>
      <button id="p-greenfield" aria-pressed="false"><b>Originate greenfield targets</b><span>Untitled areas where independent survey families coincide</span></button>
    </div>
    <div class="atlas">
      <div style="min-width:0">
        <div class="mapsheet" id="sheetA">
          <div class="maptools"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="zhome" aria-label="Show all Angola">⌂</button></div>
          <svg id="map" class="mapsvg" role="img" aria-label="Map of Angola with mineral zones, survey extents and candidates"></svg>
          <div class="floaters" id="floaters"></div>
          <div class="floatnote" id="floatnote" hidden></div>
        </div>
        <div class="sheet" style="padding:0;margin-top:8px">
          <div class="legend" id="legend"></div>
          <div class="opac"><label for="ovsel">Slide overlay</label><select id="ovsel"></select><label for="ovop">opacity</label><input id="ovop" type="range" min="0" max="100" value="70"></div>
        </div>
        <div class="board" id="board"></div>
      </div>
      <div id="card" class="card" aria-live="polite"></div>
    </div>
  </section>

  <!-- COMPARE -->
  <section id="v-compare" hidden>
    <div class="sheet"><h2>Side-by-side evidence maps</h2><p>Both sheets pan and zoom together. Pick what to show on each. When both sheets come from the same survey family, agreement between them is not corroboration.</p>
      <div id="cmpwarn" class="cmpwarn"></div></div>
    <div class="compare">
      <div class="mapsheet"><div class="opac" style="padding-top:10px"><label for="cmpL">Left</label><select id="cmpL"></select></div><svg id="mapL" class="mapsvg" role="img" aria-label="Left evidence map"></svg></div>
      <div class="mapsheet"><div class="opac" style="padding-top:10px"><label for="cmpR">Right</label><select id="cmpR"></select></div><svg id="mapR" class="mapsvg" role="img" aria-label="Right evidence map"></svg></div>
    </div>
  </section>

  <section id="v-sources" hidden></section>
  <section id="v-requests" hidden></section>
  <section id="v-verify" hidden></section>
  <section id="v-figures" hidden></section>
  <p class="foot" id="foot"></p>
</main>
<dialog id="lb"><form method="dialog" style="text-align:right"><button>Close</button></form><img id="lbimg" alt=""><p id="lbcap" class="mono" style="font-size:12px"></p></dialog>

<script>
